<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Fighter Jet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="topBar">
        <button onclick="window.location.href='index.html'"><i class="fas fa-home"></i> Home</button>
        <div id="scoreBoard">Score: <span id="scoreEl">0</span></div>
        <button onclick="history.back()"><i class="fas fa-arrow-left"></i> Back</button>
    </div>

    <div id="startScreen">
        <h1>✈️ Fighter Strike</h1>
        <p>শত্রুর মিসাইল ধ্বংস করুন!</p>
        <button id="startPlayBtn">Start Game</button>
    </div>

    <div id="gameOverModal" class="hidden">
        <h1 style="color: #ef4444;">CRASHED! 💥</h1>
        <p>Your Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
